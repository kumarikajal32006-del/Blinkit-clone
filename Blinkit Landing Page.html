<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        
        nav {
            border: 2px solid lightgray;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            gap: 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            
        }
        input {
            width: 50%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid lightgray;
        }

        nav p {
            margin: 0;
            font-size: 18px;

             }
             .grocery-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgb(8, 154, 8);
            width: 90%;
            margin: 20px auto;
            padding: 60px 50px;
            border-radius: 10px;
            
        }

    </style>


</head>
<body>

     <nav>
        <div class="logo">blinkit</div>
        <h4>Delivery in 17 minutes</h4>

        <input type="text" placeholder="Search chocolate">

        <div class="items">
        </div>
    </nav>

    
    <div class="grocery-banner">

        <div class="banner-content">
            <h1>Stock up to daily essientials</h1>

            <p>Get farm-fresh goodness & a range of exotic<br>fruits, vegetables, eggs & more</b></p>

            <button class="button">Shop Now</button>
        </div>
            
        </div>
    
  </div>


     
       
</body>
</html>
